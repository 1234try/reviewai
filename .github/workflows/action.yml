name: "AI Code Review"
description: "Review code changes with AI"

inputs:
  api-key:
    description: "OpenAI API key"
    required: true
  model:
    description: "AI model to use"
    required: false
    default: "gpt-4o-mini"
  format:
    description: "Output format: terminal, json, markdown"
    required: false
    default: "markdown"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "18"

    - name: Install reviewai
      shell: bash
      run: npm install -g reviewai

    - name: Run review
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.api-key }}
      run: |
        reviewai --format ${{ inputs.format }} --model ${{ inputs.model }} > review.md
        echo "## AI Code Review" >> $GITHUB_STEP_SUMMARY
        cat review.md >> $GITHUB_STEP_SUMMARY

    - name: Comment PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const review = fs.readFileSync('review.md', 'utf8');
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: review
          });
